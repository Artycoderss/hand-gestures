<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <link rel="icon" type="image/svg+xml" href=""/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title></title>

  <style>
    #mp-video{
      display: none;
    }
    #loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 100;
      background-color: #F5F7F9;
      transition: opacity 0.3s;

      &.loading-ended {
        opacity: 0;
        pointer-events: none;
      }

    }


    #hand-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 1;
    }

    #fuck-overlay {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;

      opacity: 0;
      background: rgba(255, 0, 0, 0.35);
      will-change: opacity;
    }

    #fuck-overlay.is-active {
      animation: fuckBlink 0.35s infinite ease-in-out;
    }

    @keyframes fuckBlink {
      0%   { opacity: 0.12; }
      50%  { opacity: 0.55; }
      100% { opacity: 0.12; }
    }

  </style>
</head>

<body>
<div id="loader"></div>

<header class="header">

</header>
<video id="mp-video" playsinline muted style="display:none;"></video>

<main class="main">

  <canvas id="hand-canvas"></canvas>
  <div id="fuck-overlay" aria-hidden="true"></div>

</main>

<footer class="footer"></footer>

<script type="module" src="/src/js/main.js"></script>
</body>
</html>
